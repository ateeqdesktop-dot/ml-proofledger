name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: make test
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Format and compile
        run: make format-check

  repository-hygiene:
    name: repository hygiene and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tracked files for common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E '(AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})' -- . ':!docs/research_notes.md'; then
            echo "Potential secret pattern found"
            exit 1
          fi
      - name: Reject committed local artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.venv|__pycache__|\.pytest_cache|model\.json|predictions\.csv)$'; then
            echo "Local artifact is tracked"
            exit 1
          fi
      - name: Compile source, examples, and scripts
        run: python -m compileall -q src tests examples scripts
      - name: Verify package metadata
        run: python -m pip install -e . && python -m pip check

  sarif:
    name: verify evidence and publish SARIF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e "."
      - name: Generate sample evidence
        run: make sample && make capture
      - name: Verify sample as SARIF
        run: proofledger verify --root . --manifest examples/proofledger.json --sarif > proofledger.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: proofledger.sarif

  build:
    name: build distribution
    runs-on: ubuntu-latest
    needs: [test, repository-hygiene]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: python -m pip install build && python -m build
      - name: Inspect distribution
        run: python -m pip install dist/*.whl && proofledger --help
